<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Hồ Sơ & Tạo CV')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="main-content py-4">
        <div class="container">
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <!-- Danh sách CV -->
                    <div class="card p-3 mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0"><i class="bi bi-folder-fill text-warning me-2"></i>Danh Sách CV</h5>
                            <a th:href="@{/candidate/cv}" class="btn btn-sm btn-primary rounded-pill">
                                <i class="bi bi-plus me-1"></i>Tạo CV Mới
                            </a>
                        </div>
                        <div class="list-group list-group-flush">
                            <a th:each="cv : ${cvList}" th:href="@{/candidate/cv(cvId=${cv.id})}"
                               class="list-group-item list-group-item-action py-3 rounded mb-1"
                               th:classappend="${currentCv.id == cv.id} ? 'active' : ''">
                                <div class="fw-bold" th:text="${cv.title}">Tên CV</div>
                                <small class="text-muted" th:classappend="${currentCv.id == cv.id} ? 'text-white-50' : ''">
                                    Cập nhật: <span th:text="${#temporals.format(cv.updatedAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </small>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-4">
                        <h4 class="fw-bold text-dark mb-3">
                            <i class="bi bi-file-earmark-text text-primary me-2"></i>
                            <span th:text="${currentCv.id != null} ? 'Cập Nhật Hồ Sơ CV' : 'Tạo Hồ Sơ CV Mới'"></span>
                        </h4>

                        <form th:action="@{/candidate/cv/save}" method="post">
                            <input type="hidden" name="id" th:value="${currentCv.id}">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Tiêu đề CV <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" th:value="${currentCv.title}" placeholder="Ví dụ: CV Lập trình viên Java Backend" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Tóm tắt bản thân / Mục tiêu nghề nghiệp <span class="text-danger">*</span></label>
                                <textarea name="summary" rows="3" class="form-control" placeholder="Mô tả tóm tắt kinh nghiệm và định hướng phát triển..." required th:text="${currentCv.summary}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Kỹ năng chuyên môn <span class="text-danger">*</span></label>
                                <textarea name="skills" rows="2" class="form-control" placeholder="Java, Spring Boot, MySQL, Git, Docker, REST API..." required th:text="${currentCv.skills}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Học vấn & Bằng cấp <span class="text-danger">*</span></label>
                                <textarea name="education" rows="2" class="form-control" placeholder="Trường Đại học, chuyên ngành, xếp loại..." required th:text="${currentCv.education}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Kinh nghiệm làm việc & Dự án đã tham gia <span class="text-danger">*</span></label>
                                <textarea name="experience" rows="4" class="form-control" placeholder="Công ty, vị trí, các dự án tiêu biểu và công nghệ đã sử dụng..." required th:text="${currentCv.experience}"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Liên kết Portfolio / GitHub / LinkedIn</label>
                                <input type="url" name="portfolioUrl" class="form-control" th:value="${currentCv.portfolioUrl}" placeholder="https://github.com/your-name">
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/candidate/cv}" class="btn btn-outline-secondary rounded-pill px-4">Làm mới</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                                    <i class="bi bi-check2 me-1"></i>Lưu Hồ Sơ CV
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
